<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>볼 파이트</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
      #unity-canvas { display: block; width: 100vw; height: 100vh; background: #ffffff; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; color: #14161a; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; transition: opacity .25s; }
      #loading h1 { margin: 0 0 28px; font-size: 56px; font-weight: 800; letter-spacing: -1px; }
      #bar { width: 320px; height: 14px; border: 3px solid #14161a; box-sizing: border-box; }
      #fill { width: 0; height: 100%; background: #14161a; transition: width .15s; }
      #status { margin-top: 14px; font-size: 15px; color: #767c86; }
      #loading.done { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>볼 파이트</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="status">불러오는 중… 0%</div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var loading = document.getElementById("loading");
      var fill = document.getElementById("fill");
      var statusText = document.getElementById("status");
      createUnityInstance(document.getElementById("unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
      }, function (progress) {
        var percent = Math.round(progress * 100);
        fill.style.width = percent + "%";
        statusText.textContent = "불러오는 중… " + percent + "%";
      }).then(function () {
        loading.className = "done";
        setTimeout(function () { loading.style.display = "none"; }, 300);
      }).catch(function (message) {
        statusText.textContent = "게임을 불러오지 못했습니다: " + message;
      });
    </script>
  </body>
</html>
